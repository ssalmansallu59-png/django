
{% extends 'base.html' %}

{% load static %}

{% block content %}


<link rel="stylesheet" href="{% static 'css/product.css' %}">

    <div class="login-card">
        <!-- Brand / Logo Header -->
        <div class="login-header">
            <!-- <a href="#" class="brand">Your<span>Brand.</span></a> -->
            <h1>Add Product</h1>
            <p>Fill out the details to list a new product</p>
        </div>

        <!-- Product Form -->
        <form method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="file">Product Image</label>
                <input type="file" id="file" name="image" required>
            </div>

            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" name="product_name" placeholder="Enter product name" required>
            </div>

            <div class="form-group">
                <label for="price">Product Price</label>
                <input type="number" id="price" name="price" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="description">Product Description</label>
                <textarea id="description" name="product_description" placeholder="Write product description here..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Add Product</button>
        </form>
    </div>

    

{% endblock %}
