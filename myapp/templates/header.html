{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Brand Header</title>
<!-- <link rel="stylesheet" href="{% static 'css/header.css' %}"> -->
 <style>
    /* ==========================================
   Modern Brand Header Stylesheet
   ========================================== */

/* CSS Reset & Variables */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --header-bg: #0f172a;       /* Deep slate background matching footer */
    --header-text: #94a3b8;     /* Muted grey text */
    --header-heading: #f8fafc;  /* Bright white heading text */
    --header-accent: #38bdf8;   /* Vibrant blue accent */
    --header-border: #1e293b;   /* Subtle border color */
}

/* Sticky Header Layout */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background-color: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    width: 100%;
}

/* Navbar Container */
.navbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Brand Logo */
.brand {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--header-heading);
    text-decoration: none;
}

.brand span {
    color: var(--header-accent);
}

/* Menu Toggle Button (Mobile Hidden by default) */
.menu-toggle {
    display: none;
    background: transparent;
    border: none;
    color: var(--header-heading);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 4px;
}

/* Navigation Links Container */
.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
}

/* Standard Links (Buttons) */
.nav-links .btn {
    color: var(--header-text);
    text-decoration: none;
    font-size: 0.95rem;
    text-transform: capitalize;
    transition: color 0.2s ease;
}

.nav-links .btn:hover {
    color: var(--header-heading);
}

/* Call-to-Action Button */
.nav-button {
    background-color: var(--header-accent);
    color: #0f172a;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: filter 0.2s ease, transform 0.2s ease;
}

.nav-button:hover {
    filter: brightness(1.1);
    transform: translateY(-2px);
}

/* ==========================================
   Responsive Breakpoints for Mobile
   ========================================== */

@media (max-width: 768px) {
    .menu-toggle {
        display: block;
    }

    .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: var(--header-bg);
        flex-direction: column;
        align-items: flex-start;
        padding: 24px 20px;
        gap: 16px;
        border-bottom: 1px solid var(--header-border);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        
        /* Hidden state for mobile toggle */
        display: none; 
    }

    /* Shown state controlled by JS toggle class */
    .nav-links.show {
        display: flex;
    }

    .nav-links .btn {
        font-size: 1.05rem;
        width: 100%;
        padding: 4px 0;
    }

    .nav-button {
        width: 100%;
        justify-content: center;
        margin-top: 8px;
    }
}
 </style>

</head>

<body>

<header class="header">
    <nav class="navbar">

        <!-- Brand Name -->
        <a href="#" class="brand">
            Your<span>Brand.</span>
        </a>

        <!-- Mobile Menu -->
        <button class="menu-toggle"
                aria-label="Toggle navigation"
                aria-expanded="false"
                onclick="toggleMenu(this)">
            ☰
        </button>

        <!-- Navigation Links -->
        <div class="nav-links" id="navLinks">
            <a class="btn" href="{% url 'home' %}">home</a>
            <a class="btn" href="{% url 'about' %}">About us</a>
            <a class="btn" href="{% url 'service' %}">Service</a>
            <a class="btn" href="{% url 'contact' %}">Contact us</a>
            <a class="btn" href="{% url 'product' %}">product </a>
            <a href="#get-started" class="nav-button">
                Get Started <span>↗</span>
            </a>
        </div>

    </nav>
</header>

<script>
function toggleMenu(button) {
    const menu = document.getElementById("navLinks");
    const isOpen = menu.classList.toggle("show");

    button.setAttribute("aria-expanded", isOpen);
    button.textContent = isOpen ? "✕" : "☰";
}
</script>

</body>
</html>
