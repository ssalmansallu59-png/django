{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/home1.css' %}">

<div class="login-card">
        <!-- Brand / Logo Header -->
        <div class="login-header">
            <a href="{% url 'home' %}" class="brand">Your<span>Brand.</span></a>
            <h1>Sign in</h1>
            <p>Enter your details to access your account</p>
        </div>

        <!-- Login Form -->
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="user">User Name</label>
                <input type="text" id="user" name="user" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Sign in</button>
        </form>

        <!-- Footer link for new users -->
        <div class="login-footer">
            <p>New to YourBrand? <a href="{% url 'registration' %}">Create account</a></p>
        </div>
    </div>

{% endblock %}
